name: Build and Publish Main Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_arm64:
        description: 同时构建 ARM64（GOST 二进制与前后端镜像）
        type: boolean
        required: false
        default: false

# 同一分支的新推送自动取消仍在排队/运行的旧构建，避免重复编译排队
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

env:
  RELEASE_TAG: latest
  IMAGE_OWNER: micah123321
  # arm64 仅在手动触发并勾选 build_arm64 时构建；push 触发默认只构建 amd64
  BUILD_ARM64: ${{ github.event_name == 'workflow_dispatch' && inputs.build_arm64 == true }}
  DOCKER_PLATFORMS: ${{ github.event_name == 'workflow_dispatch' && inputs.build_arm64 == true && 'linux/amd64,linux/arm64' || 'linux/amd64' }}

jobs:
  build-gost:
    name: Build GOST Binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.4'
          cache: true
          cache-dependency-path: ./go-gost/go.sum

      - name: Install UPX
        run: |
          wget https://github.com/upx/upx/releases/download/v4.2.1/upx-4.2.1-amd64_linux.tar.xz
          tar -xf upx-4.2.1-amd64_linux.tar.xz
          sudo mv upx-4.2.1-amd64_linux/upx /usr/local/bin/
          rm -rf upx-4.2.1-amd64_linux*

      - name: Build GOST binaries
        working-directory: ./go-gost
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -buildvcs=false -ldflags="-s -w" -o gost-amd64
          if [ "$BUILD_ARM64" = "true" ]; then
            CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -buildvcs=false -ldflags="-s -w" -o gost-arm64
          fi

      - name: Compress GOST binaries
        working-directory: ./go-gost
        run: |
          upx --best --lzma gost-amd64
          if [ "$BUILD_ARM64" = "true" ]; then
            upx --best --lzma gost-arm64
          fi

      - name: Upload GOST artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gost-binaries
          path: |
            ./go-gost/gost-amd64
            ./go-gost/gost-arm64

  build-vite:
    name: Build and Push Frontend Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up QEMU
        if: env.BUILD_ARM64 == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        run: |
          docker buildx build \
            --platform "$DOCKER_PLATFORMS" \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --push \
            --cache-from type=gha,scope=vite-frontend \
            --cache-to type=gha,scope=vite-frontend,mode=max \
            -t ghcr.io/${IMAGE_OWNER}/vite-frontend:latest \
            ./vite-frontend

  build-backend:
    name: Build and Push Backend Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up QEMU
        if: env.BUILD_ARM64 == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        run: |
          docker buildx build \
            --platform "$DOCKER_PLATFORMS" \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --push \
            --cache-from type=gha,scope=backend \
            --cache-to type=gha,scope=backend,mode=max \
            -t ghcr.io/${IMAGE_OWNER}/springboot-backend:latest \
            ./springboot-backend

  publish-release:
    name: Publish Latest Release Assets
    needs: [build-gost, build-vite, build-backend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download GOST artifacts
        uses: actions/download-artifact@v4
        with:
          name: gost-binaries
          path: ./artifacts

      - name: Publish latest release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOTES="Main branch release for ${GITHUB_SHA}. This is the only maintained channel."
          ASSETS=(
            ./artifacts/gost-amd64
          )
          if [ -f ./artifacts/gost-arm64 ]; then
            ASSETS+=("./artifacts/gost-arm64")
          fi
          ASSETS+=(
            ./install.sh
            ./panel_install.sh
            ./docker-compose-v4.yml
            ./docker-compose-v6.yml
            ./gost.sql
          )

          # 未构建 arm64 时清理 release 中的旧 gost-arm64 资产，避免过期二进制残留
          if [ ! -f ./artifacts/gost-arm64 ]; then
            gh release delete-asset "${RELEASE_TAG}" gost-arm64 --yes --repo "${GITHUB_REPOSITORY}" 2>/dev/null || true
          fi

          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "${ASSETS[@]}" --clobber --repo "${GITHUB_REPOSITORY}"
            gh release edit "${RELEASE_TAG}" --target "${GITHUB_SHA}" --title "Flux Panel Latest" --notes "${NOTES}" --latest --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${RELEASE_TAG}" "${ASSETS[@]}" --target "${GITHUB_SHA}" --title "Flux Panel Latest" --notes "${NOTES}" --latest --repo "${GITHUB_REPOSITORY}"
          fi
