name: Build and Publish Main Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  RELEASE_TAG: latest
  IMAGE_OWNER: micah123321

jobs:
  build-gost:
    name: Build GOST Binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install UPX
        run: |
          wget https://github.com/upx/upx/releases/download/v4.2.1/upx-4.2.1-amd64_linux.tar.xz
          tar -xf upx-4.2.1-amd64_linux.tar.xz
          sudo mv upx-4.2.1-amd64_linux/upx /usr/local/bin/
          rm -rf upx-4.2.1-amd64_linux*

      - name: Build GOST binary (AMD64)
        working-directory: ./go-gost
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -buildvcs=false -ldflags="-s -w" -o gost-amd64

      - name: Build GOST binary (ARM64)
        working-directory: ./go-gost
        run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -buildvcs=false -ldflags="-s -w" -o gost-arm64

      - name: Compress GOST binaries
        working-directory: ./go-gost
        run: |
          upx --best --lzma gost-amd64
          upx --best --lzma gost-arm64

      - name: Upload GOST artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gost-binaries
          path: |
            ./go-gost/gost-amd64
            ./go-gost/gost-arm64

  build-vite:
    name: Build and Push Frontend Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --push \
            -t ghcr.io/${IMAGE_OWNER}/vite-frontend:latest \
            ./vite-frontend

  build-backend:
    name: Build and Push Backend Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --push \
            -t ghcr.io/${IMAGE_OWNER}/springboot-backend:latest \
            ./springboot-backend

  publish-release:
    name: Publish Latest Release Assets
    needs: [build-gost, build-vite, build-backend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download GOST artifacts
        uses: actions/download-artifact@v4
        with:
          name: gost-binaries
          path: ./artifacts

      - name: Publish latest release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOTES="Main branch release for ${GITHUB_SHA}. This is the only maintained channel."
          ASSETS=(
            ./artifacts/gost-amd64
            ./artifacts/gost-arm64
            ./install.sh
            ./panel_install.sh
            ./docker-compose-v4.yml
            ./docker-compose-v6.yml
            ./gost.sql
          )

          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "${ASSETS[@]}" --clobber --repo "${GITHUB_REPOSITORY}"
            gh release edit "${RELEASE_TAG}" --target "${GITHUB_SHA}" --title "Flux Panel Latest" --notes "${NOTES}" --latest --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${RELEASE_TAG}" "${ASSETS[@]}" --target "${GITHUB_SHA}" --title "Flux Panel Latest" --notes "${NOTES}" --latest --repo "${GITHUB_REPOSITORY}"
          fi
